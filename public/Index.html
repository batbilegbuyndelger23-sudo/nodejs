<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MNFLIX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07090f;color:#edf0fa;font-family:sans-serif}nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#0d1018;border-bottom:1px solid #1c2236}.logo{font-size:1.6rem;font-weight:900;letter-spacing:3px;color:#e8b84a}a.admin-btn{background:#e8b84a;color:#000;padding:8px 16px;border-radius:4px;text-decoration:none;font-weight:700;font-size:.9rem}.hero{padding:40px 20px;text-align:center;border-bottom:1px solid #1c2236}.hero h1{font-size:2rem;color:#e8b84a;margin-bottom:8px}.hero p{color:#68748f;font-size:.95rem}.section{padding:20px}.section h2{font-size:1.1rem;font-weight:700;letter-spacing:1px;margin-bottom:16px;color:#e8b84a}.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.card{flex:0 0 140px;background:#111520;border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid #1c2236}.card img{width:100%;height:200px;object-fit:cover;background:#1c2236}.card-ph{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:#111520}.card-info{padding:8px}.card-title{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{font-size:.72rem;color:#68748f;margin-top:2px}.sub-badge{display:inline-block;background:#f5e642;color:#000;font-size:.6rem;font-weight:800;padding:1px 5px;border-radius:2px;margin-top:3px}.empty{text-align:center;padding:40px;color:#68748f}.empty a{color:#e8b84a}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column}.modal.open{display:flex}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0d1018;border-bottom:1px solid #1c2236}.modal-title{font-weight:700;font-size:1rem}.close-btn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}.video-wrap{position:relative;background:#000;flex:1}.video-wrap video{width:100%;height:100%;object-fit:contain}.sub-layer{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:92%;text-align:center;pointer-events:none;display:none}.sub-layer span{background:rgba(0,0,0,.8);color:#f5e642;font-size:1rem;font-weight:600;padding:4px 12px;border-radius:3px;line-height:1.5}.controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:24px 12px 10px}.progress{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:4px;cursor:pointer;margin-bottom:8px}.progress-fill{height:100%;background:#e8b84a;border-radius:4px;width:0%}.ctrl-row{display:flex;align-items:center;gap:10px}.c-btn{background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;padding:4px}.sub-btn{background:none;border:1px solid #f5e642;color:#f5e642;padding:2px 8px;border-radius:2px;font-size:.72rem;font-weight:700;cursor:pointer}.sub-btn.off{border-color:#68748f;color:#68748f}.time{margin-left:auto;font-size:.75rem;color:#68748f}.modal-foot{padding:10px 16px;background:#0d1018;border-top:1px solid #1c2236}.modal-foot .t{font-weight:700;font-size:.9rem}.modal-foot .m{font-size:.75rem;color:#68748f}</style></head><body>
<nav><div class="logo">MNFLIX</div><a href="/admin" class="admin-btn">+ Нэмэх</a></nav>
<div class="hero"><h1>🎬 MNFLIX</h1><p>Монгол хадмал орчуулгатай кино үзэх платформ</p></div>
<div class="section"><h2>БҮХ КИНО</h2><div class="cards" id="cards"><div class="empty">Кино байхгүй байна. <a href="/admin">Кино нэмэх →</a></div></div></div>
<div class="modal" id="modal">
<div class="modal-head"><div class="modal-title" id="mTitle">—</div><button class="close-btn" onclick="closePlayer()">✕</button></div>
<div class="video-wrap"><video id="vid" preload="metadata" crossorigin="anonymous" playsinline></video>
<div class="sub-layer" id="subLayer"><span id="subTxt"></span></div>
<div class="controls"><div class="progress" id="prog" onclick="seek(event)"><div class="progress-fill" id="pFill"></div></div>
<div class="ctrl-row"><button class="c-btn" id="ppBtn" onclick="togglePlay()">▶</button><button class="sub-btn" id="subBtn" onclick="toggleSub()">SUB MN</button><span class="time" id="timeEl">0:00/0:00</span></div></div></div>
<div class="modal-foot"><div class="t" id="mName">—</div><div class="m" id="mMeta">—</div></div></div>
<script>
let movies=[],subOn=true,si=null;
const vid=document.getElementById('vid');
async function load(){const r=await fetch('/api/movies');movies=await r.json();render()}
function render(){const el=document.getElementById('cards');if(!movies.length){el.innerHTML='<div class="empty">Кино байхгүй байна. <a href="/admin">Кино нэмэх →</a></div>';return}el.innerHTML=movies.map(m=>`<div class="card" onclick="open_('${m.id}')">${m.thumbnail?`<img src="/uploads/thumbnails/${m.thumbnail}" loading="lazy"/>`:'<div class="card-ph">🎬</div>'}<div class="card-info"><div class="card-title">${m.title}</div><div class="card-meta">${m.year} · ${m.genre}</div>${m.subFile?'<span class="sub-badge">SUB MN</span>':''}</div></div>`).join('')}
function open_(id){const m=movies.find(x=>x.id===id);if(!m)return;document.getElementById('mTitle').textContent=m.title;document.getElementById('mName').textContent=m.title;document.getElementById('mMeta').textContent=`${m.year} · ${m.genre}`;vid.src=`/uploads/videos/${m.videoFile}`;Array.from(vid.querySelectorAll('track')).forEach(t=>vid.removeChild(t));if(m.subFile){const t=document.createElement('track');t.kind='subtitles';t.srclang='mn';t.src=`/uploads/subs/${m.subFile}`;t.default=true;vid.appendChild(t);startSub()}document.getElementById('modal').classList.add('open');document.getElementById('ppBtn').textContent='▶'}
function startSub(){if(si)clearInterval(si);si=setInterval(()=>{if(!subOn)return;const tr=vid.textTracks[0];if(!tr)return;tr.mode='hidden';const c=tr.activeCues;const l=document.getElementById('subLayer');const t=document.getElementById('subTxt');if(c&&c.length){t.innerHTML=c[0].text.replace(/\n/g,'<br>');l.style.display='block'}else l.style.display='none'},100)}
function closePlayer(){vid.pause();vid.src='';document.getElementById('modal').classList.remove('open');document.getElementById('subLayer').style.display='none';if(si){clearInterval(si);si=null}}
function togglePlay(){vid.paused?vid.play():vid.pause()}
vid.onplay=()=>document.getElementById('ppBtn').textContent='⏸';
vid.onpause=()=>document.getElementById('ppBtn').textContent='▶';
vid.ontimeupdate=()=>{const d=vid.duration||0,c=vid.currentTime||0;document.getElementById('pFill').style.width=(d?c/d*100:0)+'%';const f=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;document.getElementById('timeEl').textContent=`${f(c)}/${f(d)}`}
function seek(e){const r=document.getElementById('prog').getBoundingClientRect();vid.currentTime=(e.clientX-r.left)/r.width*(vid.duration||0)}
function toggleSub(){subOn=!subOn;const b=document.getElementById('subBtn');b.textContent=subOn?'SUB MN':'SUB OFF';b.className='sub-btn'+(subOn?'':' off');if(!subOn)document.getElementById('subLayer').style.display='none'}
document.addEventListener('keydown',e=>{if(!document.getElementById('modal').classList.contains('open'))return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.code==='Escape')closePlayer()});
load();
</script></body></html>
